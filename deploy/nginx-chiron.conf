# nginx site for CHIRON. deploy/install.sh replaces __DOMAIN__ and installs this as /etc/nginx/sites-available/chiron.
# HTTPS is added afterwards by: certbot --nginx -d __DOMAIN__ --redirect
# The app needs HTTPS: its sign-in cookie is marked Secure on any host that is not localhost.
server {
    listen 80;
    server_name __DOMAIN__;
    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:5496;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # a step waits for its transaction's receipt (up to a minute)
        proxy_read_timeout 90s;
    }
}
